  ["me", "Una cosa que vi: la puerta tiene cerradura de código y en la cocina había un cartel de normas para huéspedes. ¿Se alquilaba por días?"],
  ["them", "¡Genial! Sí, lo tenía en Airbnb pero me cansé de los turistas y ahora lo alquilo solo por larga duración. Te mando el contrato en PDF para que lo firmes."],
  ["them", "Para cerrarlo necesito la fianza y un mes de garantía, 2.500 € en total, por transferencia a mi cuenta ES60 0049 1500 0512 3456 7892. Entras el día 1 y ese día te doy el código nuevo."],
  ["me", "Perfecto. Antes de pagar, ¿me puedes pasar la nota simple o un recibo del IBI a tu nombre?"],
  ["them", "Eso no hace falta, el contrato ya lleva mis datos y mi DNI. Tengo otras dos personas que lo vieron esta semana, si me haces la transferencia hoy es tuyo."],
]

