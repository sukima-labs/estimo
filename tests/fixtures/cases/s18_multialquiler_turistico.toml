id = "s18_multialquiler_turistico"
label = "scam"
expect = ["amber", "red"]
expect_signals = ["tourist_as_long_term", "evasive_on_checks"]
kind = "piso"
notes = "Caso real (Madrid, 2026, detenida por la Policía Nacional): reservaba pisos turísticos en Airbnb, los anunciaba en idealista como larga duración, los enseñaba en persona haciéndose pasar por la propietaria y firmaba con varios inquilinos a la vez (un mes de fianza y otro de garantía). Hay visita, así que la mayoría de las señales no salen: lo delatan el piso turístico y la negativa a enseñar la nota simple."

chat = [
