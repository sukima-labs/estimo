[project]
name = "mikiwame"
version = "0.1.0"
description = "Rental listing scam-risk reports (closed concept project of Sukima Labs)"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28.1",
    "phonenumbers>=9.0.40",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-telegram-bot>=22.8",
    "schwifty>=2026.7.3",
    "sqlalchemy>=2.1.1",
    "starlette>=1.8.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
mikiwame = "mikiwame.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mikiwame"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tools/build_site.py" = ["E501"]  # long HTML lines

[dependency-groups]
dev = [
    "font-roboto>=0.0.1",
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.9",
]
